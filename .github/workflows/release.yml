name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build all platform packages
        run: node scripts/build-npm.mjs ${{ github.ref_name }}

      # Platform packages first: the root package lists them as
      # optionalDependencies, so publishing it first leaves a window where
      # `npm i -g memrato` installs a shim with no binary behind it.
      # Catches an empty or invalid token. It cannot catch a token that lacks 2FA
      # bypass — whoami succeeds with one of those and only publish fails.
      - name: Check npm auth
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set on this repository."
            exit 1
          fi
          echo "authenticated to npm as: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The ./ prefix is load-bearing. `npm publish npm-dist/memrato-darwin-arm64`
      # matches npm's <user>/<repo> GitHub shorthand, so npm tries to clone
      # github.com/npm-dist/memrato-darwin-arm64 instead of reading the directory.
      # npm refuses to publish a prerelease without an explicit --tag, so a
      # v1.0.0-rc.1 tag would fail every publish below without this.
      - name: Pick the dist-tag
        run: |
          case "${{ github.ref_name }}" in
            *-*) echo "NPM_TAG=--tag next" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_TAG=" >> "$GITHUB_ENV" ;;
          esac

      - name: Publish platform packages
        run: |
          for pkg in ./npm-dist/memrato-*; do
            echo "publishing $pkg"
            if ! npm publish "$pkg" --access public --provenance $NPM_TAG; then
              echo "::error::publish failed. On E403 mentioning two-factor auth, NPM_TOKEN must be a Granular Access Token with 'Bypass 2FA' enabled (or a classic Automation token). A plain Publish token cannot publish from CI."
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root package
        run: npm publish ./npm-dist/memrato --access public --provenance $NPM_TAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
