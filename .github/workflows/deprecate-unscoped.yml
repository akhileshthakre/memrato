# Manual one-shot. The unscoped platform packages were published before npm's spam
# heuristic forced the move to @akhileshthakre/*, and nothing references them any more:
# the root package that listed them as optionalDependencies never published. Marking
# them deprecated stops them reading as live packages.
#
# Run from the Actions tab, or: gh workflow run deprecate-unscoped.yml
# Safe to re-run — deprecating an already-deprecated package just resets the message.
name: deprecate-unscoped

on: workflow_dispatch

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # No checkout: npm deprecate only talks to the registry.
      - name: Deprecate the unscoped platform packages
        run: |
          for pkg in memrato-darwin-arm64 memrato-darwin-x64 memrato-linux-arm64 memrato-linux-x64; do
            echo "deprecating $pkg"
            npm deprecate "$pkg" "Renamed to @akhileshthakre/$pkg. Install the memrato package instead."
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort only. The registry CDN lags a couple of minutes behind a write,
      # so blank output here means "too early to tell", not "it failed" — check
      # https://registry.npmjs.org/<pkg> directly if you need certainty.
      - name: Verify
        run: |
          for pkg in memrato-darwin-arm64 memrato-darwin-x64 memrato-linux-arm64 memrato-linux-x64; do
            printf '  %-24s %s\n' "$pkg" "$(npm view "$pkg" deprecated 2>/dev/null || echo 'NOT DEPRECATED')"
          done
